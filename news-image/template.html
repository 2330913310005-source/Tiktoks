<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  :root{
    --w:1080px; --h:1920px;
    --accent:#FF3B30;        /* overridden per story by data.accent */
    --ink:#FFFFFF;
    --ink-soft:rgba(255,255,255,.78);
    --bg:#0B0D12;
    --gutter:80px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:var(--w);height:var(--h);background:var(--bg);overflow:hidden}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .card{position:relative;width:100%;height:100%;overflow:hidden}

  /* Layer 1: photo, or an abstract gradient when there is no photo */
  .photo{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.02)}
  .photo.none{
    background:
      radial-gradient(900px 700px at 85% 10%, color-mix(in srgb,var(--accent) 55%,transparent), transparent 70%),
      radial-gradient(800px 900px at 0% 60%, #1f3a8a66, transparent 70%),
      linear-gradient(160deg,#141826,#07080c);
  }
  .grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  /* Layer 2: scrim so the text always passes contrast */
  .scrim{position:absolute;inset:0;background:
    linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 38%,rgba(5,6,10,.82) 62%,rgba(5,6,10,.97) 100%)}

  /* Layer 3: content */
  .top{position:absolute;top:var(--gutter);left:var(--gutter);right:var(--gutter);display:flex;justify-content:space-between;align-items:center}
  .brand{display:flex;align-items:center;gap:16px;font:700 34px/1 Inter;letter-spacing:-.01em}
  .brand i{width:18px;height:18px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 30%,transparent)}
  .live{font:700 26px/1 Inter;letter-spacing:.14em;text-transform:uppercase;padding:14px 22px;border-radius:999px;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.22)}

  .body{position:absolute;left:var(--gutter);right:var(--gutter);bottom:230px}
  .kicker{display:inline-flex;align-items:center;gap:14px;background:var(--accent);color:#fff;font:800 30px/1 Inter;letter-spacing:.12em;text-transform:uppercase;padding:16px 24px;border-radius:10px;margin-bottom:40px}
  h1{font-family:Archivo,Inter,sans-serif;font-weight:900;font-size:var(--hsize,112px);line-height:.98;letter-spacing:-.025em;text-wrap:balance;text-shadow:0 2px 30px rgba(0,0,0,.35)}
  h1 mark{background:none;color:var(--accent)}
  .dek{margin-top:40px;font:500 40px/1.35 Inter;color:var(--ink-soft);max-width:26ch;text-wrap:pretty}
  .rule{width:120px;height:8px;background:var(--accent);border-radius:4px;margin-top:48px}

  .foot{position:absolute;left:var(--gutter);right:var(--gutter);bottom:var(--gutter);display:flex;justify-content:space-between;align-items:flex-end;font:500 28px/1.3 Inter;color:rgba(255,255,255,.62);border-top:1px solid rgba(255,255,255,.18);padding-top:32px}
  .foot b{color:#fff;font-weight:600}

  /* TikTok/Reels safe zone: app UI covers bottom ~300px and right ~140px */
  body.story .body{bottom:470px;right:160px}
  body.story .foot{bottom:320px;right:160px}

  /* Square / 4:5 variant */
  body.feed{--h:1350px;--gutter:72px}
  body.feed .body{bottom:190px}
  body.feed .dek{font-size:34px}
</style>
</head>
<body>
<div class="card">
  <div class="photo" id="photo"></div>
  <div class="grain"></div>
  <div class="scrim"></div>
  <div class="top">
    <div class="brand"><i></i><span id="brand"></span></div>
    <div class="live" id="tag"></div>
  </div>
  <div class="body">
    <div class="kicker" id="kicker"></div>
    <h1 id="headline"></h1>
    <p class="dek" id="dek"></p>
    <div class="rule"></div>
  </div>
  <div class="foot">
    <div>Sumber: <b id="source"></b></div>
    <div id="date"></div>
  </div>
</div>
<script>
  // window.DATA is injected by render.js; defaults are for opening the file directly.
  const d = Object.assign({
    brand:"@beritakita", tag:"Terkini", kicker:"Ekonomi",
    headline:"Harga beras turun *8%* jelang akhir tahun",
    dek:"Pasokan dari panen raya membuat harga di pasar induk kembali stabil.",
    source:"Kementerian Perdagangan", date:"22 Nov 2026",
    accent:"#FF3B30", photo:"", format:"story"
  }, window.DATA||{});
  const $=id=>document.getElementById(id);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  document.documentElement.style.setProperty('--accent',d.accent);
  document.body.classList.add(d.format==='feed'?'feed':'story');
  $('brand').textContent=d.brand; $('tag').textContent=d.tag; $('kicker').textContent=d.kicker;
  $('headline').innerHTML=esc(d.headline).replace(/\*(.+?)\*/g,'<mark>$1</mark>'); // *word* = accent highlight
  $('dek').textContent=d.dek; $('source').textContent=d.source; $('date').textContent=d.date;
  if(!d.dek) $('dek').remove();
  if(!d.tag) $('tag').remove();
  const p=$('photo'); if(d.photo) p.style.backgroundImage=`url("${d.photo}")`; else p.classList.add('none');
  // Auto-fit headline: shrink until it fits in ~55% of the canvas height
  const h=$('headline'), max=(d.format==='feed'?0.42:0.42)*innerHeight;
  let size=d.format==='feed'?100:118;
  const fit=()=>{h.style.setProperty('--hsize',size+'px'); while(h.offsetHeight>max&&size>56){size-=4;h.style.setProperty('--hsize',size+'px')}};
  document.fonts.ready.then(()=>{fit();document.body.dataset.ready='1'});
</script>
</body>
</html>
